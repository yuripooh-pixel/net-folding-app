<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전개도 접기 놀이 - 입체도형 DIY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #fdf6ff; color: #2d2440;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px 14px 32px;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { font-size: 1.6rem; color: #8a2be2; }
  header p { font-size: .95rem; color: #6b5f80; margin-top: 4px; }
  .app { width: 100%; max-width: 760px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .tabs button {
    border: 2px solid #d9b8f5; background: #fff; color: #6a2bb0;
    padding: 8px 16px; border-radius: 999px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .tabs button.on { background: #a14ef0; border-color: #a14ef0; color: #fff; }
  #stage {
    width: 100%; height: 420px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(#ffffff, #f1e6ff); box-shadow: 0 6px 20px rgba(120, 60, 180, .15);
    touch-action: none;
  }
  .controls {
    display: flex; align-items: center; gap: 12px; margin: 14px 0;
    background: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: 0 2px 8px rgba(120,60,180,.08);
  }
  .controls span { font-size: .9rem; font-weight: 700; color: #6b5f80; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #a14ef0; height: 6px; }
  #play {
    border: none; background: #ff7ab6; color: #fff; font-weight: 700; font-size: 1rem;
    padding: 9px 16px; border-radius: 10px; cursor: pointer; white-space: nowrap;
  }
  .card { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(120,60,180,.08); }
  .card h2 { font-size: 1.2rem; color: #8a2be2; margin-bottom: 8px; }
  .stats { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 90px; text-align: center; background: #f6edff; border-radius: 10px; padding: 8px; }
  .stat b { display: block; font-size: 1.5rem; color: #6a2bb0; }
  .stat small { color: #6b5f80; }
  .tip { font-size: .95rem; line-height: 1.6; color: #45395a; }
  .hint { text-align: center; font-size: .8rem; color: #9a8fb0; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>✂️ 전개도 접기 놀이</h1>
  <p>평평한 전개도를 접으면 어떤 입체도형이 될까요? 슬라이더를 움직여 보세요!</p>
</header>

<div class="app">
  <div class="tabs" id="tabs"></div>
  <div id="stage"></div>
  <p class="hint">마우스(손가락)로 끌면 돌려볼 수 있고, 휠(두 손가락)로 확대할 수 있어요.</p>
  <div class="controls">
    <span>펼침</span>
    <input type="range" id="fold" min="0" max="1" step="0.001" value="0">
    <span>접힘</span>
    <button id="play">▶ 자동 접기</button>
  </div>
  <div class="card" id="info"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 기본 장면 ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(3.2, 4.2, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd9c7f0, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(3, 6, 4);
scene.add(sun);

const grid = new THREE.GridHelper(8, 16, 0xd9c7f0, 0xeadcfa);
grid.position.y = -0.01;
scene.add(grid);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- 면 만들기 도구 ----------
const COLORS = [0xb66cf2, 0xff7ab6, 0x5cc8ff, 0xffc94d, 0x6ee7a8, 0xff9a62];
let root = new THREE.Group();
scene.add(root);
let hinges = [];

// pts: [[x,z], ...] 평면 위 다각형 또는 THREE.Shape
function face(pts, color) {
  const shape = pts instanceof THREE.Shape ? pts
    : new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const geo = new THREE.ShapeGeometry(shape, 48);
  geo.rotateX(Math.PI / 2); // (x, y) -> (x, z)
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, side: THREE.DoubleSide, roughness: .6,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  }));
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x4a2a70 })));
  return mesh;
}

// 경첩(접는 선)에 붙은 면. 로컬 +z 방향으로 뻗어 있고, angle 만큼 위로 접힘
function flap(parent, x, z, yaw, angle, pts, color) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  parent.add(g);
  const h = new THREE.Group();
  g.add(h);
  h.add(face(pts, color));
  hinges.push({ h, angle });
  return h;
}

const deg = d => d * Math.PI / 180;
const square = [[-.5, 0], [.5, 0], [.5, 1], [-.5, 1]];

// ---------- 도형 정의 ----------
const SHAPES = {
  cube: {
    name: '정육면체',
    stats: [['면', 6], ['모서리', 12], ['꼭짓점', 8]],
    tip: '정사각형 6개로 이루어진 전개도예요. 접었을 때 서로 마주 보는 면은 3쌍이고, 한 꼭짓점에는 면 3개가 모여요.',
    build() {
      root.add(face([[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]], COLORS[0]));
      const front = flap(root, 0, .5, 0, deg(90), square, COLORS[1]);
      flap(front, 0, 1, 0, deg(90), square, COLORS[2]);           // 윗면
      flap(root, 0, -.5, Math.PI, deg(90), square, COLORS[3]);
      flap(root, .5, 0, Math.PI / 2, deg(90), square, COLORS[4]);
      flap(root, -.5, 0, -Math.PI / 2, deg(90), square, COLORS[5]);
    },
  },
  prism: {
    name: '삼각기둥',
    stats: [['면', 5], ['모서리', 9], ['꼭짓점', 6]],
    tip: '밑면은 서로 평행하고 합동인 삼각형 2개, 옆면은 직사각형 3개예요. 직사각형들이 120°씩 접히며 지붕 모양이 돼요.',
    build() {
      const a = 1, L = 1.6, th = a * Math.sqrt(3) / 2;
      const rect = [[-L / 2, 0], [L / 2, 0], [L / 2, a], [-L / 2, a]];
      root.add(face([[-L / 2, -a / 2], [L / 2, -a / 2], [L / 2, a / 2], [-L / 2, a / 2]], COLORS[0]));
      flap(root, 0, a / 2, 0, deg(120), rect, COLORS[1]);
      flap(root, 0, -a / 2, Math.PI, deg(120), rect, COLORS[2]);
      const tri = [[-a / 2, 0], [a / 2, 0], [0, th]];
      flap(root, L / 2, 0, Math.PI / 2, deg(90), tri, COLORS[3]);
      flap(root, -L / 2, 0, -Math.PI / 2, deg(90), tri, COLORS[4]);
    },
  },
  pyramid: {
    name: '사각뿔',
    stats: [['면', 5], ['모서리', 8], ['꼭짓점', 5]],
    tip: '밑면은 사각형 1개, 옆면은 삼각형 4개예요. 4개의 삼각형이 위로 접혀 한 점(각뿔의 꼭짓점)에서 만나요.',
    build() {
      const s = 1; // 옆면 삼각형의 높이
      const ang = Math.PI - Math.acos(.5 / s);
      const tri = [[-.5, 0], [.5, 0], [0, s]];
      root.add(face([[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]], COLORS[0]));
      [[0, .5, 0], [0, -.5, Math.PI], [.5, 0, Math.PI / 2], [-.5, 0, -Math.PI / 2]]
        .forEach(([x, z, y], i) => flap(root, x, z, y, ang, tri, COLORS[i + 1]));
    },
  },
  cylinder: {
    name: '원기둥',
    stats: [['밑면', '2 (원)'], ['옆면', '1 (곡면)'], ['꼭짓점', 0]],
    tip: '영상 속 교구처럼 직사각형 1개와 원 2개로 이루어져요. 직사각형을 둥글게 말면 옆면이 되는데, 직사각형의 가로 길이는 밑면인 원의 둘레(지름 × 3.14)와 같아요!',
    build() {
      const r = .55, W = 2 * Math.PI * r, H = 1.5;
      const geo = new THREE.PlaneGeometry(W, H, 96, 1);
      const base = geo.attributes.position.array.slice();
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: COLORS[0], side: THREE.DoubleSide, roughness: .6,
      }));
      root.add(mesh);
      // 테두리 선
      const outline = new THREE.Line(new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ color: 0x4a2a70 }));
      root.add(outline);

      const circle = new THREE.Shape();
      circle.absarc(0, r, r, 0, Math.PI * 2, false);
      flap(root, 0, H / 2, 0, deg(90), circle, COLORS[1]);
      flap(root, 0, -H / 2, Math.PI, deg(90), circle, COLORS[2]);

      const roll = (x, t) => {
        const th = t * Math.PI * 2;
        if (th < 1e-4) return [x, 0];
        const R = W / th, p = x / R;
        return [R * Math.sin(p), R * (1 - Math.cos(p))];
      };
      this.update = t => {
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const [x, y] = roll(base[i * 3], t);
          pos.setXYZ(i, x, y, base[i * 3 + 1]);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        // 테두리: 위쪽 가장자리 → 아래쪽 가장자리
        const pts = [];
        const N = 96;
        for (let k = 0; k <= N; k++) { const [x, y] = roll(-W / 2 + W * k / N, t); pts.push(new THREE.Vector3(x, y, H / 2)); }
        for (let k = N; k >= 0; k--) { const [x, y] = roll(-W / 2 + W * k / N, t); pts.push(new THREE.Vector3(x, y, -H / 2)); }
        pts.push(pts[0].clone());
        outline.geometry.setFromPoints(pts);
      };
    },
  },
};

// ---------- UI ----------
const slider = document.getElementById('fold');
const playBtn = document.getElementById('play');
const info = document.getElementById('info');
const tabs = document.getElementById('tabs');
let current = null;

function select(key) {
  scene.remove(root);
  root = new THREE.Group();
  scene.add(root);
  hinges = [];
  current = SHAPES[key];
  current.update = null;
  current.build();
  apply(+slider.value);

  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.key === key));
  info.innerHTML = `
    <h2>${current.name}</h2>
    <div class="stats">${current.stats.map(([k, v]) => `<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('')}</div>
    <p class="tip">💡 ${current.tip}</p>`;
}

function apply(t) {
  const e = t * t * (3 - 2 * t); // 부드럽게
  hinges.forEach(({ h, angle }) => { h.rotation.x = -angle * e; });
  if (current.update) current.update(e);
}

Object.entries(SHAPES).forEach(([key, s]) => {
  const b = document.createElement('button');
  b.textContent = s.name;
  b.dataset.key = key;
  b.onclick = () => select(key);
  tabs.appendChild(b);
});

slider.addEventListener('input', () => { playing = false; playBtn.textContent = '▶ 자동 접기'; apply(+slider.value); });

let playing = false, dir = 1;
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 멈춤' : '▶ 자동 접기';
  if (playing) dir = +slider.value >= 1 ? -1 : 1;
};

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = (now - last) / 1000; last = now;
  if (playing) {
    let v = +slider.value + dir * dt * 0.4;
    if (v >= 1) { v = 1; dir = -1; playing = false; playBtn.textContent = '◀ 다시 펼치기'; }
    if (v <= 0) { v = 0; dir = 1; playing = false; playBtn.textContent = '▶ 자동 접기'; }
    slider.value = v;
    apply(v);
  }
  controls.update();
  renderer.render(scene, camera);
});

select('cylinder');
</script>
</body>
</html>
